<body class="bg-surface-container-lowest text-on-background font-body min-h-screen antialiased selection:bg-primary-container selection:text-white">
<div class="flex flex-col md:flex-row min-h-screen w-full">
<!-- Left Half: Institutional Branding -->
<div class="w-full md:w-1/2 bg-primary-container flex flex-col items-center justify-center p-8 md:p-16 lg:p-24 relative overflow-hidden shrink-0">
<!-- Decorative subtle pattern overlay -->
<div class="absolute inset-0 opacity-[0.03] bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-white to-transparent pointer-events-none"></div>
<div class="relative z-10 flex flex-col items-center text-center max-w-lg">
<div class="w-24 h-24 md:w-32 md:h-32 rounded-full bg-white/10 flex items-center justify-center mb-8 shadow-inner border border-white/20 backdrop-blur-sm">
<span class="material-symbols-outlined text-white text-[64px] md:text-[80px]" style="font-variation-settings: 'FILL' 1;">account_balance</span>
</div>
<h1 class="text-5xl md:text-6xl lg:text-7xl font-headline font-bold text-white tracking-tight mb-4">SIGAE</h1>
<p class="text-lg md:text-xl font-body text-on-primary-container font-medium leading-relaxed">
                    Gestión Educativa
                </p>
<div class="mt-12 h-1 w-16 bg-primary-fixed rounded-full opacity-50"></div>
</div>
</div>
<!-- Right Half: Recovery Form -->
<div class="w-full md:w-1/2 bg-surface-container-lowest flex items-center justify-center p-8 md:p-16 relative">
<div class="w-full max-w-sm xl:max-w-md">
<div class="mb-10 text-center md:text-left">
<h2 class="text-2xl md:text-3xl font-headline font-bold text-on-background mb-3">Recuperar Cuenta</h2>
<p class="text-sm md:text-base font-body text-on-surface-variant leading-relaxed">
                        Ingrese su correo institucional para recibir un enlace de recuperación.
                    </p>
</div>
<form class="space-y-6">
<!-- Email Field -->
<div class="space-y-1.5">
<label class="block text-sm font-label font-medium text-on-surface" for="email">
                            Correo Institucional <span class="text-error">*</span>
</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-[18px]">mail</span>
</div>
<input class="block w-full pl-10 pr-3 h-[36px] bg-surface-container-lowest border border-outline-variant rounded-lg text-sm font-body text-on-surface placeholder-outline focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary transition-shadow" id="email" name="email" placeholder="usuario@institucion.edu.pe" required="" type="email"/>
</div>
</div>
<!-- Submit Button -->
<div class="pt-2">
<button class="w-full h-[36px] flex items-center justify-center bg-primary text-white rounded-xl text-sm font-label font-semibold shadow-sm hover:bg-surface-tint focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-all active:scale-[0.98]" type="submit">
                            Enviar enlace de recuperación
                            <span class="material-symbols-outlined ml-2 text-[18px]">send</span>
</button>
</div>
</form>
<!-- Back Link -->
<div class="mt-6 text-center md:text-left">
<a class="text-sm font-medium text-primary hover:text-primary-container flex items-center justify-center md:justify-start gap-1 transition-colors focus:outline-none focus:underline" href="#">
<span class="material-symbols-outlined text-[18px]">chevron_left</span>
                        Volver al inicio de sesión
                    </a>
</div>
<!-- Footer -->
<div class="mt-12 text-center md:text-left border-t border-surface-variant pt-6">
<p class="text-xs font-label text-outline flex items-center justify-center md:justify-start gap-1.5">
<span class="material-symbols-outlined text-[14px]">info</span>
                        Si tiene problemas de acceso, contacte al soporte técnico.
                    </p>
</div>
</div>
</div>
</div>
