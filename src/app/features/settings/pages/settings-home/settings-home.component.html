<section class="mx-auto flex w-full max-w-4xl flex-col gap-6 pb-28">
  @if (isLoading()) {
    <div class="rounded-xl border border-slate-200 bg-white p-10 text-center shadow-sm">
      <span class="loading loading-spinner loading-md text-primary"></span>
      <p class="mt-4 text-sm font-medium text-slate-500">Cargando configuración institucional...</p>
    </div>
  } @else {
    <form class="space-y-6" [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="rounded-xl border border-slate-200 bg-white p-6 shadow-sm">
        <h2 class="mb-6 text-lg font-bold text-slate-900">Identidad Institucional</h2>

        <div class="flex flex-col items-start gap-8 md:flex-row">
          <div class="flex flex-col items-center gap-3">
            <div class="relative">
              <div
                class="flex h-32 w-32 items-center justify-center overflow-hidden rounded-full border-2 border-slate-200 bg-white shadow-sm"
              >
                @if (logoPreview()) {
                  <img
                    [src]="logoPreview()!"
                    alt="Logo institucional"
                    class="h-full w-full object-contain"
                  />
                } @else {
                  <div class="flex h-full w-full items-center justify-center bg-primary/5 text-primary">
                    <span class="material-symbols-outlined !text-[44px]">account_balance</span>
                  </div>
                }
              </div>

              <button
                type="button"
                class="absolute bottom-0 right-0 flex h-8 w-8 items-center justify-center rounded-full bg-primary text-white shadow-lg transition-transform hover:scale-110 focus:outline-none focus-visible:ring-2 focus-visible:ring-primary/30"
                aria-label="Cambiar logo institucional"
                (click)="triggerLogoSelection()"
              >
                <span class="material-symbols-outlined !text-[18px]">photo_camera</span>
              </button>

              <input
                #logoInput
                type="file"
                class="hidden"
                accept="image/*"
                (change)="onLogoSelected($event)"
              />
            </div>

            <span class="text-[11px] font-bold uppercase tracking-[0.24em] text-slate-400">
              Logo del Colegio
            </span>
          </div>

          <div class="w-full flex-1">
            <app-form-field
              label="Nombre de la Institución"
              fieldId="systemName"
              [required]="true"
              [error]="systemNameError()"
            >
              <input
                id="systemName"
                type="text"
                formControlName="systemName"
                class="w-full border-0 bg-transparent p-0 text-sm text-base-content placeholder:text-base-content/40 focus:outline-none"
                placeholder="Ej. I.E. Simón Rodríguez - Nasca"
              />
            </app-form-field>
          </div>
        </div>
      </div>

      <div class="rounded-xl border border-slate-200 bg-white p-6 shadow-sm">
        <h2 class="mb-6 text-lg font-bold text-slate-900">Información de Contacto y Ubicación</h2>

        <div class="grid grid-cols-1 gap-6 md:grid-cols-2">
          <div class="md:col-span-2">
            <app-form-field label="Dirección" fieldId="address">
              <input
                id="address"
                type="text"
                formControlName="address"
                class="w-full border-0 bg-transparent p-0 text-sm text-base-content placeholder:text-base-content/40 focus:outline-none"
                placeholder="Ej. Av. Principal 123"
              />
            </app-form-field>
          </div>

          <app-form-field label="Ciudad" fieldId="city">
            <input
              id="city"
              type="text"
              formControlName="city"
              class="w-full border-0 bg-transparent p-0 text-sm text-base-content placeholder:text-base-content/40 focus:outline-none"
              placeholder="Ciudad"
            />
          </app-form-field>

          <app-form-field label="Número de Celular" fieldId="supportPhone">
            <input
              id="supportPhone"
              type="text"
              formControlName="supportPhone"
              class="w-full border-0 bg-transparent p-0 text-sm text-base-content placeholder:text-base-content/40 focus:outline-none"
              placeholder="+51 999 999 999"
            />
          </app-form-field>

          <div class="md:col-span-2">
            <app-form-field
              label="Correo de Atención"
              fieldId="supportEmail"
              [required]="true"
              [error]="supportEmailError()"
            >
              <input
                id="supportEmail"
                type="email"
                formControlName="supportEmail"
                class="w-full border-0 bg-transparent p-0 text-sm text-base-content placeholder:text-base-content/40 focus:outline-none"
                placeholder="contacto@colegio.edu.pe"
              />
            </app-form-field>
          </div>
        </div>
      </div>
    </form>
  }
</section>

<div class="fixed bottom-0 left-0 right-0 z-30 flex justify-end gap-3 border-t border-base-200 bg-base-100 p-4 px-4 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] transition-[left] duration-300 ease-[cubic-bezier(0.4,0,0.2,1)] md:left-[var(--shell-sidebar-width)] md:px-6">
  <app-action-button
    label="Cancelar"
    variant="neutral"
    [disabled]="isLoading() || isSubmitting()"
    (clicked)="onCancel()"
  />
  <app-action-button
    label="Guardar Cambios"
    icon="save"
    [loading]="isSubmitting()"
    loadingLabel="Guardando..."
    [disabled]="isLoading() || isSubmitting()"
    (clicked)="onSubmit()"
  />
</div>
