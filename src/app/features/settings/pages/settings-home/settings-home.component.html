<section class="mx-auto flex w-full max-w-6xl flex-col gap-6">
  <header class="rounded-2xl border border-base-300 bg-base-100 px-6 py-6 shadow-sm md:px-8">
    <p class="text-sm font-semibold uppercase tracking-[0.24em] text-primary/75">Administración</p>
    <h1 class="mt-2 text-2xl font-bold tracking-tight text-base-content md:text-3xl">Configuración</h1>
    <p class="mt-3 max-w-2xl text-sm leading-6 text-base-content/65 md:text-base">
      Centraliza los accesos administrativos que no aparecen como acceso directo en la navegación principal.
    </p>
  </header>

  <div class="grid gap-5 md:grid-cols-2 xl:grid-cols-3">
    @for (shortcut of shortcuts; track shortcut.route) {
      <article class="flex h-full flex-col rounded-2xl border border-base-300 bg-base-100 p-6 shadow-sm transition-transform duration-200 hover:-translate-y-0.5 hover:shadow-md">
        <div class="flex h-12 w-12 items-center justify-center rounded-2xl bg-primary/10 text-primary">
          <span class="material-symbols-outlined !text-[24px]">{{ shortcut.icon }}</span>
        </div>

        <h2 class="mt-5 text-lg font-semibold text-base-content">{{ shortcut.title }}</h2>
        <p class="mt-2 flex-1 text-sm leading-6 text-base-content/65">
          {{ shortcut.description }}
        </p>

        <app-action-button
          className="mt-6 justify-start"
          variant="outline"
          [label]="'Abrir ' + shortcut.title"
          icon="arrow_forward"
          iconPosition="end"
          [routerLink]="shortcut.route"
        />
      </article>
    }
  </div>
</section>
