<div class="relative overflow-hidden rounded-lg border-2 border-dashed border-base-300 bg-base-100">
  <canvas #signatureCanvas class="block h-56 w-full touch-none"></canvas>
  @if (!hasSignature() && !isInteracting()) {
    <div
      class="pointer-events-none absolute inset-0 flex items-center justify-center px-6 text-center"
    >
      <p class="text-sm text-base-content/35">Espacio para firma del docente</p>
    </div>
  }
</div>
