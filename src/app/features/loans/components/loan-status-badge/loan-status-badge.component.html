<span
  class="inline-flex items-center rounded-full font-semibold"
  [class.gap-2]="!compact()"
  [class.gap-1.5]="compact()"
  [class.px-3]="!compact()"
  [class.py-1]="!compact()"
  [class.px-2.5]="compact()"
  [class.py-0.5]="compact()"
  [class.text-xs]="!compact()"
  [class.text-[11px]]="compact()"
  [class]="badgeClass()"
>
  <span
    class="rounded-full"
    [class.h-2]="!compact()"
    [class.w-2]="!compact()"
    [class.h-1.5]="compact()"
    [class.w-1.5]="compact()"
    [class]="dotClass()"
  ></span>
  {{ status() }}
</span>
