<div>
  <!-- Page Actions -->
  <div class="mb-8 flex items-center justify-between">
    <div>
      <h2 class="text-2xl font-bold text-base-content">Docentes</h2>
      <p class="text-sm text-base-content/60 mt-1">Gestión del personal docente y su historial de préstamos.</p>
    </div>
    
    <div class="flex items-center gap-4">
      <app-search-input
        widthClass="w-[340px]"
        placeholder="Buscar por nombre o DNI..."
        [value]="searchQuery()"
        (valueChange)="onSearch($event)"
      />
      <app-action-button
        label="Agregar Docente"
        icon="add"
      />
    </div>
  </div>

  <!-- Cards Grid -->
  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    @for (teacher of filteredTeachers(); track teacher.id) {
      <app-teacher-card
        [teacher]="teacher"
        (viewHistory)="onViewHistory($event)"
      />
    }
  </div>

  <!-- Pagination -->
  <div class="mt-10 flex items-center justify-between border-t border-base-200 pt-6">
    <p class="text-sm text-base-content/60">Mostrando <span class="font-semibold text-base-content">{{ filteredTeachers().length }}</span> de <span class="font-semibold text-base-content">{{ teachers().length }}</span> docentes</p>
    
    <div class="join">
      <button class="join-item btn btn-sm bg-base-100 border border-base-300" disabled>
        <span class="material-symbols-outlined text-sm">arrow_back_ios</span>
      </button>
      <button class="join-item btn btn-sm btn-primary">1</button>
      <button class="join-item btn btn-sm bg-base-100 border border-base-300 hover:bg-base-200">2</button>
      <button class="join-item btn btn-sm bg-base-100 border border-base-300 hover:bg-base-200">3</button>
      <button class="join-item btn btn-sm btn-disabled border-none bg-transparent">...</button>
      <button class="join-item btn btn-sm bg-base-100 border border-base-300 hover:bg-base-200">14</button>
      <button class="join-item btn btn-sm bg-base-100 border border-base-300 hover:bg-base-200">
        <span class="material-symbols-outlined text-sm">arrow_forward_ios</span>
      </button>
    </div>
  </div>
</div>
