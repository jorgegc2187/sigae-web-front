<div
  class="card h-full overflow-hidden border border-base-300 bg-base-100 shadow-sm transition-all hover:-translate-y-0.5 hover:shadow-md"
>
  <div class="h-2 w-full" [class]="topBarClass()"></div>

  <div class="card-body flex-grow p-6">
    <div class="flex items-start justify-between gap-3">
      <div class="flex items-start gap-4">
        <div
          class="flex h-12 w-12 shrink-0 select-none items-center justify-center rounded-full bg-primary text-lg font-bold text-primary-content"
        >
          {{ teacher().initials }}
        </div>

        <div class="space-y-1">
          <h3 class="card-title text-lg leading-tight">{{ teacher().name }}</h3>
          <p class="text-xs text-base-content/60">DNI: {{ teacher().dni }}</p>
          <p class="text-sm font-medium italic text-base-content/70">{{ teacher().specialty }}</p>
        </div>
      </div>

      <app-status-badge [label]="teacher().status" [tone]="statusTone()" [compact]="true" />
    </div>

    <div class="divider my-4"></div>

    <div class="space-y-3 text-sm">
      <div class="flex items-center gap-2 text-base-content/60">
        <span class="material-symbols-outlined text-[18px] text-base-content/45">mail</span>
        <span class="truncate">{{ teacher().email ?? 'Sin correo registrado' }}</span>
      </div>

      <div class="flex items-center gap-2 text-base-content/60">
        <span class="material-symbols-outlined text-[18px] text-base-content/45">phone</span>
        <span>{{ teacher().phone ?? 'Sin teléfono registrado' }}</span>
      </div>
    </div>
  </div>

  @if (canManage()) {
    <div class="flex justify-end gap-1 border-t border-base-200 bg-base-200/50 px-6 py-4">
      <button
        type="button"
        class="inline-flex h-9 w-9 items-center justify-center rounded-lg text-base-content/50 transition-colors hover:bg-primary/10 hover:text-primary"
        aria-label="Editar docente"
        (click)="onEdit()"
      >
        <span class="material-symbols-outlined text-[20px]">edit</span>
      </button>
      <button
        type="button"
        class="inline-flex h-9 w-9 items-center justify-center rounded-lg text-base-content/50 transition-colors"
        [class.hover:bg-error/10]="teacher().status === 'Activo'"
        [class.hover:text-error]="teacher().status === 'Activo'"
        [class.hover:bg-primary/10]="teacher().status !== 'Activo'"
        [class.hover:text-primary]="teacher().status !== 'Activo'"
        [attr.aria-label]="statusActionLabel()"
        (click)="onToggleStatus()"
      >
        <span class="material-symbols-outlined text-[20px]">{{ statusActionIcon() }}</span>
      </button>
    </div>
  }
</div>
