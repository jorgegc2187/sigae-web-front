<dialog
  #dialog
  class="modal"
  (cancel)="onNativeCancel($event)"
>
  <div class="modal-box mx-3 flex max-h-[calc(100dvh-1.5rem)] w-auto max-w-md flex-col rounded-xl border border-base-300 bg-base-100 p-0 shadow-xl sm:mx-0 sm:w-full">
    <div class="flex items-start justify-between gap-4 border-b border-base-300 px-6 py-5">
      <div class="flex min-w-0 items-start gap-3">
        <span [class]="iconClass()" aria-hidden="true">
          <span class="material-symbols-outlined text-[22px]">{{ resolvedIcon() }}</span>
        </span>
        <div class="min-w-0 space-y-1">
          <h2 class="text-lg font-semibold leading-tight text-base-content">{{ title() }}</h2>
          <p class="text-sm leading-relaxed text-base-content/65">{{ message() }}</p>
        </div>
      </div>

      <button
        type="button"
        class="btn btn-ghost btn-sm btn-circle"
        aria-label="Cerrar confirmación"
        [disabled]="loading()"
        (click)="onCancel()"
      >
        <span class="material-symbols-outlined text-[18px]">close</span>
      </button>
    </div>

    @if (hasDetails()) {
      <div class="space-y-4 px-6 py-5">
        <ng-content select="[modal-details]" />
      </div>
    }

    <div class="flex justify-end gap-3 border-t border-base-300 px-6 py-4">
      <app-action-button
        [label]="cancelLabel()"
        variant="neutral"
        [disabled]="loading()"
        (clicked)="onCancel()"
      />
      <app-action-button
        [label]="confirmLabel()"
        [icon]="confirmIcon()"
        [variant]="confirmVariant()"
        [className]="confirmClass()"
        [loading]="loading()"
        [loadingLabel]="loadingLabel()"
        [disabled]="disableConfirm()"
        (clicked)="onConfirm()"
      />
    </div>
  </div>

  <button
    type="button"
    class="modal-backdrop"
    aria-label="Cerrar confirmación"
    (click)="onBackdropClick()"
  >
    Cerrar
  </button>
</dialog>
