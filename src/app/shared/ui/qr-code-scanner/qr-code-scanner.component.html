<div class="relative h-full min-h-0 text-neutral-content">
  @if (scannerState() === 'error') {
    <div class="flex h-full min-h-[26rem] flex-col items-center justify-center gap-4 px-8 py-10 text-center">
      <span class="material-symbols-outlined text-[42px] text-error-content/90">warning</span>
      <p class="max-w-xs text-sm font-medium leading-6 text-neutral-content/88">{{ errorMessage() }}</p>
    </div>
  } @else {
    <div class="relative h-full min-h-[26rem] sm:min-h-[30rem]">
      <video
        #videoElement
        class="absolute inset-0 block h-full w-full object-cover opacity-75"
        muted
        playsinline
      ></video>

      <div class="absolute inset-0 bg-black/35"></div>
      <div class="absolute inset-x-0 top-0 h-28 bg-gradient-to-b from-black/70 to-transparent"></div>
      <div class="absolute inset-x-0 bottom-0 h-28 bg-gradient-to-t from-black/80 to-transparent"></div>

      <div class="pointer-events-none absolute inset-0 flex items-center justify-center px-8 py-10">
        <div class="relative h-64 w-64 max-w-full sm:h-72 sm:w-72">
          <div class="absolute inset-0 rounded-lg bg-white/10 shadow-[0_0_0_4000px_rgba(0,0,0,0.4)]"></div>

          <div class="absolute left-0 top-0 h-8 w-8 rounded-tl-lg border-l-4 border-t-4 border-primary"></div>
          <div class="absolute right-0 top-0 h-8 w-8 rounded-tr-lg border-r-4 border-t-4 border-primary"></div>
          <div class="absolute bottom-0 left-0 h-8 w-8 rounded-bl-lg border-b-4 border-l-4 border-primary"></div>
          <div class="absolute bottom-0 right-0 h-8 w-8 rounded-br-lg border-b-4 border-r-4 border-primary"></div>

          <div class="absolute left-4 right-4 top-1/2 h-0.5 -translate-y-1/2 bg-primary shadow-[0_0_10px_rgba(29,78,216,0.9)]"></div>
        </div>
      </div>

      <div class="absolute inset-x-0 top-0 px-6 pt-12 text-center md:pt-8">
        <h3 class="text-lg font-semibold tracking-tight text-white sm:text-xl">Escanear Activo</h3>
        <p class="mt-2 text-sm text-white/72">
          Alinee el código QR dentro del recuadro para escanear
        </p>
      </div>

      @if (scannerState() === 'requesting') {
        <div class="absolute inset-x-0 bottom-24 flex justify-center">
          <span class="rounded-full border border-white/10 bg-black/35 px-3 py-1.5 text-xs font-medium text-white/80">
            Iniciando cámara...
          </span>
        </div>
      }
    </div>
  }
</div>
