@if (active()) {
  <div
    [class]="containerClass()"
    role="status"
    aria-live="polite"
    [attr.aria-label]="resolvedAriaLabel()"
  >
    <div class="flex w-full max-w-sm flex-col items-center rounded-xl border border-base-300 bg-base-100 p-8 text-center shadow-xl">
      <div class="relative mb-4 h-12 w-12">
        <svg class="h-full w-full animate-spin text-primary" viewBox="0 0 24 24" aria-hidden="true">
          <circle
            class="opacity-25"
            cx="12"
            cy="12"
            fill="none"
            r="10"
            stroke="currentColor"
            stroke-width="4"
          />
          <path
            class="opacity-75"
            d="M4 12a8 8 0 0 1 8-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 0 1 4 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
            fill="currentColor"
          />
        </svg>
      </div>

      <h3 class="mb-2 text-lg font-bold text-base-content">{{ title() }}</h3>
      <p class="text-sm leading-relaxed text-base-content/65">{{ message() }}</p>
    </div>
  </div>
}
