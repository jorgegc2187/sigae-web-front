<button
  type="button"
  [class]="rootClass()"
  [attr.aria-label]="item().title"
  (click)="onSelect()"
>
  <div class="flex h-11 w-11 shrink-0 items-center justify-center rounded-2xl" [class]="iconShellClass()">
    <span class="material-symbols-outlined text-[21px]">{{ icon() }}</span>
  </div>

  <div class="min-w-0 flex-1">
    <div class="flex items-start gap-3">
      <div class="min-w-0 flex-1">
        <div class="flex items-center gap-2">
          <p class="truncate text-sm font-semibold leading-5 text-base-content">{{ item().title }}</p>
          @if (!item().read) {
            <span class="h-2.5 w-2.5 shrink-0 rounded-full bg-primary"></span>
          }
        </div>

        <p class="mt-1 line-clamp-2 text-sm leading-5 text-base-content/65">{{ item().message }}</p>
      </div>
    </div>

    <div class="mt-2 flex items-center gap-2 text-[11px] font-medium">
      <span class="text-base-content/45">{{ occurredAtLabel() }}</span>
      @if (!item().active) {
        <span class="rounded-full bg-base-200 px-2 py-0.5 text-base-content/55">Resuelta</span>
      }
    </div>
  </div>
</button>
