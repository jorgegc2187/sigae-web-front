<div
  class="w-full origin-top overflow-hidden transition-all duration-300"
  [class.mb-4]="visible()"
  [class.max-h-32]="visible()"
  [class.opacity-100]="visible()"
  [class.scale-100]="visible()"
  [class.translate-y-0]="visible()"
  [class.max-h-0]="!visible()"
  [class.opacity-0]="!visible()"
  [class.scale-95]="!visible()"
  [class.-translate-y-1]="!visible()"
  [attr.aria-hidden]="!visible()"
>
  <section
    class="w-full rounded-lg border border-[rgba(0,74,198,0.2)] bg-[#dbe1ff] p-3 text-center"
  >
    <div class="flex flex-col items-center justify-center gap-2 text-center sm:flex-row sm:gap-4">
      <p class="text-[13px] font-normal leading-[18px] text-[#003ea8]">
        {{ message() }}
      </p>

      <button
        type="button"
        class="cursor-pointer text-[12px] font-semibold leading-4 tracking-[0.05em] text-[#004ac6] underline underline-offset-2 transition-colors hover:text-[#003ea8]"
        (click)="allFilteredSelected() ? clearRequested.emit() : selectAllRequested.emit()"
      >
        {{ secondaryActionLabel() }}
      </button>
    </div>
  </section>
</div>
