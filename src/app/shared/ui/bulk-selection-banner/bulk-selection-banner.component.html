<section
  class="animate-in fade-in zoom-in-95 slide-in-from-top-1 origin-top rounded-lg border border-primary/20 bg-primary-fixed px-4 py-3 text-center shadow-[0_8px_22px_-16px_rgba(37,99,235,0.28)] duration-300 ease-out"
>
  <div class="flex flex-col items-center justify-center gap-2 text-center sm:flex-row sm:gap-4">
    <p class="text-sm font-medium text-on-primary-fixed-variant">
      {{ message() }}
    </p>

    <button
      type="button"
      class="text-sm font-semibold text-primary underline underline-offset-2 transition-colors hover:text-on-primary-fixed-variant"
      (click)="allFilteredSelected() ? clearRequested.emit() : selectAllRequested.emit()"
    >
      {{ secondaryActionLabel() }}
    </button>
  </div>
</section>
