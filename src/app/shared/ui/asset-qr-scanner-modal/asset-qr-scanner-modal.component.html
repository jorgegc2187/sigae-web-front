<div
  class="fixed inset-0 z-[60] flex items-center justify-center bg-black/80 p-4 backdrop-blur-sm md:p-8"
  role="dialog"
  aria-modal="true"
>
  <button
    type="button"
    class="absolute inset-0"
    aria-label="Cerrar escáner QR"
    (click)="requestClose()"
  ></button>

  <div
    class="relative flex h-full max-h-[800px] w-full max-w-md flex-col overflow-hidden rounded-xl bg-neutral shadow-2xl ring-1 ring-white/10 md:max-w-lg"
  >
    <div class="relative flex-1">
      <app-qr-code-scanner (scanDetected)="handleScanDetected($event)" />
    </div>

    <div class="relative z-10 flex flex-col gap-6 bg-gradient-to-t from-black/90 via-black/80 to-transparent px-6 pb-8 pt-6 md:pb-6">
      <button
        type="button"
        class="flex h-12 w-full items-center justify-center gap-2 rounded-xl border-2 border-primary bg-transparent font-medium text-primary transition-all hover:bg-primary/10 active:scale-[0.98]"
        (click)="requestClose()"
      >
        <span class="material-symbols-outlined text-[20px]">close</span>
        Cancelar
      </button>
    </div>
  </div>
</div>
