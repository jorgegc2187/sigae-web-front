<aside
  class="app-shell-sidebar fixed left-0 top-0 z-50 flex h-full w-[240px] -translate-x-full flex-col border-r border-slate-200 bg-slate-50 py-6 md:pointer-events-auto md:translate-x-0"
  [class.translate-x-0]="isMobileOpen()"
  [class.pointer-events-none]="!isMobileOpen()"
  [class.pointer-events-auto]="isMobileOpen()"
>
  <div class="app-shell-sidebar-inner flex h-full flex-col px-0">
    <div class="relative mb-8 flex h-12 items-center">
      <div class="app-shell-icon-container">
        <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-lg bg-gradient-to-br from-primary to-secondary shadow-lg shadow-primary/25">
          <span class="material-symbols-outlined text-primary-content" style="font-variation-settings: 'FILL' 1;">account_balance</span>
        </div>
      </div>
      <div class="app-shell-brand-copy min-w-0 overflow-hidden">
        <h1 class="truncate text-2xl font-bold leading-tight tracking-tight text-blue-700">{{ appName }}</h1>
        <p class="truncate text-[10px] font-semibold uppercase tracking-wider text-slate-500">Gestión Global</p>
      </div>
    </div>

    <nav class="flex-1 space-y-1">
      @for (item of navItems(); track item.route) {
        @if (item.showDividerBefore) {
          <div class="mx-4 my-4 border-t border-base-300"></div>
        }

        <a
          [routerLink]="item.route"
          (click)="closeOnNavigate()"
          class="app-shell-sidebar-nav-item relative mx-0 flex h-12 items-center text-slate-600 transition-all duration-200 active:scale-95 focus:outline-none focus-visible:ring-2 focus-visible:ring-primary/30 hover:bg-slate-100 hover:text-slate-900"
          [class.rounded-lg]="!isItemActive(item)"
          [class.rounded-xl]="isItemActive(item)"
          [class.bg-gradient-to-r]="isItemActive(item)"
          [class.from-primary]="isItemActive(item)"
          [class.to-secondary]="isItemActive(item)"
          [class.text-white]="isItemActive(item)"
          [class.shadow-lg]="isItemActive(item)"
          [class.shadow-primary/30]="isItemActive(item)"
          [attr.aria-current]="isItemActive(item) ? 'page' : null"
          [attr.aria-label]="isDesktopCollapsed() ? item.label : null"
        >
          <div class="app-shell-icon-container">
            <span
              class="material-symbols-outlined !text-[20px]"
              [class.text-slate-500]="!isItemActive(item)"
              [class.text-white]="isItemActive(item)"
            >
              {{ item.icon }}
            </span>
          </div>
          <span
            class="app-shell-sidebar-label text-sm font-medium tracking-[0.01em]"
            [class.flex-1]="!!item.badgeCount"
            [class.ml-1]="!item.badgeCount"
            [class.font-semibold]="isItemActive(item)"
            [class.text-white]="isItemActive(item)"
            [class.text-slate-600]="!isItemActive(item)"
          >
            {{ item.label }}
          </span>
          @if (item.badgeCount) {
            <span class="app-shell-sidebar-badge mr-4 rounded-full bg-error px-2 py-0.5 text-[11px] font-bold text-error-content">
              {{ item.badgeCount }}
            </span>
          }
          <span class="app-shell-sidebar-tooltip">{{ item.label }}</span>
        </a>
      }
    </nav>

    <button
      type="button"
      class="absolute -right-3 top-8 hidden h-6 w-6 items-center justify-center rounded-full border border-slate-200 bg-white text-slate-400 shadow-sm transition-colors hover:text-blue-600 md:flex"
      [attr.aria-label]="isDesktopCollapsed() ? 'Expandir navegación' : 'Colapsar navegación'"
      [attr.aria-expanded]="!isDesktopCollapsed()"
      (click)="onToggleDesktop()"
    >
      <span class="app-shell-sidebar-toggle-icon material-symbols-outlined !text-[16px] transition-transform duration-300">chevron_left</span>
    </button>
  </div>
</aside>
