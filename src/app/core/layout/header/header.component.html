<header class="fixed left-0 right-0 top-0 z-40 flex h-16 items-center justify-between border-b border-base-300 bg-base-100 px-4 shadow-sm md:left-[240px] md:px-8">
  <div class="flex min-w-0 items-center gap-3 md:gap-4">
    <button
      type="button"
      class="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg text-base-content/60 transition-colors hover:bg-base-200 hover:text-primary md:hidden"
      (click)="onMenuClick()"
      aria-label="Abrir navegación"
    >
      <span class="material-symbols-outlined" data-icon="menu">menu</span>
    </button>

    <h2 class="truncate text-lg font-bold tracking-tight text-primary font-headline md:text-xl">{{ pageTitle() }}</h2>
    @if (pageSubtitle()) {
      <div class="mx-2 hidden h-6 w-px bg-base-300 sm:block"></div>
      <div class="hidden items-center gap-2 text-xs font-medium text-base-content/60 sm:flex">
        <span class="text-base-content/70">{{ pageSubtitle() }}</span>
      </div>
    }
  </div>
  
  <div class="flex shrink-0 items-center gap-2 sm:gap-3 md:gap-6">
    <!-- 1. Search -->
    <button class="hidden w-9 h-9 items-center justify-center text-base-content/60 hover:text-primary hover:bg-base-200 rounded-lg transition-colors cursor-pointer sm:flex">
      <span class="material-symbols-outlined !text-[20px]">search</span>
    </button>

    <!-- 2. Notifications -->
    <button class="w-9 h-9 relative flex items-center justify-center text-base-content/60 hover:text-primary hover:bg-base-200 rounded-lg transition-colors cursor-pointer">
      <span class="material-symbols-outlined">notifications</span>
      <span class="absolute top-1 right-1 w-4 h-4 bg-error text-error-content text-[10px] font-bold rounded-full flex items-center justify-center border-2 border-base-100">5</span>
    </button>

    <!-- 3. Theme toggle (contrast) -->
    <button class="w-9 h-9 flex items-center justify-center text-base-content/60 hover:text-primary hover:bg-base-200 rounded-lg transition-colors cursor-pointer"
            (click)="themeService.toggle()"
            title="Alternar tema">
      <span class="material-symbols-outlined !text-[20px]">contrast</span>
    </button>

    <div class="hidden h-8 w-px bg-base-300 md:block"></div>

    <!-- 4. Soporte -->
    <button class="hidden text-sm text-base-content/60 hover:text-primary transition-colors cursor-pointer lg:block">Soporte</button>

    <!-- 5+6. Nombre + rol + avatar -->
    <div class="flex items-center gap-3 cursor-pointer group">
      <div class="hidden text-right sm:block">
        <p class="text-[13px] font-medium text-base-content leading-none group-hover:text-primary transition-colors">Admin Principal</p>
        <p class="text-[11px] text-base-content/50 leading-none mt-1">Administrador</p>
      </div>
      <div class="w-9 h-9 rounded-full border-2 border-base-200 shadow-sm overflow-hidden flex items-center justify-center bg-base-300">
        <span class="material-symbols-outlined text-base-content/50">person</span>
      </div>
    </div>
  </div>
</header>
