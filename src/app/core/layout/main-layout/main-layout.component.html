<div
  class="app-shell min-h-screen overflow-hidden bg-base-200 text-base-content antialiased"
  [class.sidebar-collapsed]="isDesktopSidebarCollapsed()"
  [style.--shell-sidebar-width.px]="sidebarWidth()"
>
  <app-sidebar
    [isMobileOpen]="isMobileSidebarOpen()"
    [isDesktopCollapsed]="isDesktopSidebarCollapsed()"
    (toggleDesktop)="toggleDesktopSidebar()"
    (closeMobile)="closeMobileSidebar()"
  />

  @if (isMobileSidebarOpen()) {
    <button
      type="button"
      class="fixed inset-0 z-40 bg-base-content/40 md:hidden"
      (click)="closeMobileSidebar()"
      aria-label="Cerrar navegación"
    ></button>
  }

  <app-header (menuClick)="toggleMobileSidebar()" />
  <main class="app-shell-main ml-0 mt-16 min-h-[calc(100vh-64px)] overflow-y-auto p-4 md:ml-[var(--shell-sidebar-width)] md:px-8 md:py-6">
    <router-outlet />
  </main>
</div>
